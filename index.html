<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fluid/Granular Engine</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="simCanvas"></canvas>

    <div id="ui-left">
        <input type="checkbox" id="sandChk" checked> Sand <input type="range" id="sandSizeSlider" min="0" max="200" value="100">
        <input type="checkbox" id="waterChk"> Water <input type="range" id="waterSizeSlider" min="0" max="200" value="100">
        <button id="clearBtn">Clear All</button>
    </div>

    <div id="ui-right">
        <label><input type="checkbox" id="stuffChk" onclick="document.getElementById('stats').style.display = this.checked ? 'block' : 'none';"> stuff</label>
        <div id="stats">FPS: 0
Frame: 0ms
TPS: 0
Active: 0
Up: 0 rows
Renderer: ?
Sand: 0
Water: 0
Wet Sand: 0
Total: 0
Empty: 0
Grid: 0x0</div>
    </div>

    <script src="js/renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
