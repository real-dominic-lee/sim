<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fluid/Granular Engine</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; background: #fff; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; touch-action: none; }
        #ui-left { position: absolute; top: 5px; left: 5px; z-index: 10; font-size: 12px; display: flex; gap: 8px; align-items: center; }
        #ui-right { position: absolute; top: 5px; right: 5px; z-index: 10; font-size: 12px; text-align: right; }
        #stats { display: none; text-align: right; white-space: pre; line-height: 1.4; margin-top: 2px; }
    </style>
</head>
<body>
    <canvas id="simCanvas"></canvas>
    
    <div id="ui-left">
        <input type="checkbox" id="sandChk" checked> Sand <input type="range" id="sandSizeSlider" min="0" max="200" value="100">
        <input type="checkbox" id="waterChk"> Water <input type="range" id="waterSizeSlider" min="0" max="200" value="100">
        <button id="clearBtn">Clear All</button>
    </div>
    
    <div id="ui-right">
        <label><input type="checkbox" id="stuffChk" onclick="document.getElementById('stats').style.display = this.checked ? 'block' : 'none';"> stuff</label>
        <div id="stats">FPS: 0
Frame: 0ms
TPS: 0
Active: 0
Up: 0 rows
Renderer: ?
Sand: 0
Water: 0
Wet Sand: 0
Total: 0
Empty: 0
Grid: 0x0</div>
    </div>

    <script>
        const workerCode = `
        const MAT = { EMPTY: 0, SAND: 1, WATER: 2, WET_SAND: 3, DENSITY: [0, 4, 1, 4], FRICTION: [1, 0.8, 0.995, 0.6] };
        
        function tryDiag(engine, t, cx, cy, cIdx, dir, speed) {
            const W=engine.W, H=engine.H, g=engine.grid, vx=engine.vx, vy=engine.vy, u=engine.upd;
            let tCx = cx + dir;
            if (tCx >= 0 && tCx < W && cy + 1 < H) {
                let sIdx = cy * W + tCx, dIdx = sIdx + W;
                let sType = g[sIdx], dType = g[dIdx];
                let canSide = (sType === MAT.EMPTY) || (sType === MAT.WATER && MAT.DENSITY[t] > MAT.DENSITY[MAT.WATER]);
                let canDown = (dType === MAT.EMPTY) || (dType === MAT.WATER && MAT.DENSITY[t] > MAT.DENSITY[MAT.WATER]);
                if (canSide && canDown) {
                    if (t === MAT.SAND && dType === MAT.WATER) {
                        g[dIdx] = MAT.WET_SAND; g[cIdx] = MAT.EMPTY; vx[cIdx]=0; vy[cIdx]=0;
                    } else {
                        g[dIdx] = t; 
                        if (dType === MAT.WATER) {
                            g[cIdx] = MAT.WATER; vy[cIdx] = -1.5; 
                        } else {
                            g[cIdx] = MAT.EMPTY; vx[cIdx]=0; vy[cIdx]=0;
                        }
                        vx[dIdx] = dir * speed; vy[dIdx] = 0;
                    }
                    u[dIdx] = 1; u[cIdx] = 1; engine.addA(dIdx); engine.addA(cIdx); engine.wake(cIdx);
                    return true;
                }
            }
            return false;
        }

        function tryDensitySlide(engine, t, cx, cy, cIdx, dir) {
            const W=engine.W, H=engine.H, g=engine.grid, vx=engine.vx, vy=engine.vy, u=engine.upd;
            let tCx = cx + dir;
            if (tCx >= 0 && tCx < W && cy + 1 < H) {
                let sIdx = cy * W + tCx, dIdx = sIdx + W;
                let sType = g[sIdx], dType = g[dIdx];
                let canSide = (sType === MAT.EMPTY) || (sType === MAT.WATER && MAT.DENSITY[t] > MAT.DENSITY[MAT.WATER]);
                let canDown = (dType === MAT.EMPTY) || (dType === MAT.WATER && MAT.DENSITY[t] > MAT.DENSITY[MAT.WATER]);
                if (canSide && canDown) {
                    if (t === MAT.SAND && dType === MAT.WATER) {
                        g[dIdx] = MAT.WET_SAND; g[cIdx] = MAT.EMPTY; vx[cIdx]=0; vy[cIdx]=0;
                    } else {
                        g[dIdx] = t; 
                        if (dType === MAT.WATER) {
                            g[cIdx] = MAT.WATER; vy[cIdx] = -1.5; 
                        } else {
                            g[cIdx] = MAT.EMPTY; vx[cIdx]=0; vy[cIdx]=0;
                        }
                        vy[dIdx] = 0; vx[dIdx] = dir * 1.5;
                    }
                    u[dIdx] = 1; u[cIdx] = 1; engine.addA(dIdx); engine.addA(cIdx); engine.wake(cIdx);
                    return true;
                }
            }
            return false;
        }

        function tryRoll(engine, t, cx, cy, cIdx, dir) {
            const W=engine.W, H=engine.H, g=engine.grid, vx=engine.vx, vy=engine.vy, u=engine.upd;
            if (cx + dir < 0 || cx + dir >= W) return false;
            let hIdx = cIdx + dir;
            let dIdx = hIdx + W;
            if (g[hIdx] === MAT.EMPTY && g[dIdx] === t) {
                if (Math.random() < 0.2) { 
                    g[hIdx] = t; g[cIdx] = MAT.EMPTY;
                    vx[hIdx] = dir * 2.5; vy[hIdx] = -0.2;
                    u[hIdx] = 1; u[cIdx] = 1; engine.addA(hIdx); engine.wake(cIdx);
                    return true;
                }
            }
            return false;
        }

        class PhysicsEngine {
            constructor(w, h) {
                this.W = w; this.H = h;
                this.grid = new Uint8Array(w * h);
                this.vx = new Float32Array(w * h);
                this.vy = new Float32Array(w * h);
                this.upd = new Uint8Array(w * h);
                this.maxA = w * h;
                this.actL = new Int32Array(this.maxA);
                this.nxtL = new Int32Array(this.maxA);
                this.ep = new Uint32Array(w * h);
                this.epc = 0; this.actC = 0; this.nxtC = 0; this.paintQ = [];
                // Dirty row span: rows [dMin, dMax] changed since last render send
                this.dMin = h; this.dMax = -1;
            }
            clear() { this.grid.fill(0); this.vx.fill(0); this.vy.fill(0); this.ep.fill(0); this.epc = this.actC = this.nxtC = 0; this.paintQ.length = 0; this.dMin = 0; this.dMax = this.H - 1; }
            addA(i) { 
                let y = (i / this.W) | 0;
                if (y < this.dMin) this.dMin = y;
                if (y > this.dMax) this.dMax = y;
                if (this.ep[i] !== this.epc && this.nxtC < this.maxA) { this.ep[i] = this.epc; this.nxtL[this.nxtC++] = i; } 
            }
            
            wake(i) { 
                const W=this.W, H=this.H, ep=this.ep, epc=this.epc, nxtL=this.nxtL, maxA=this.maxA;
                let nc = this.nxtC;
                let x=i%W, y=(i/W)|0; 
                
                if(y>0){ 
                    if(x>0) { let idx=i-W-1; if (ep[idx] !== epc && nc < maxA) { ep[idx] = epc; nxtL[nc++] = idx; } }
                    { let idx=i-W; if (ep[idx] !== epc && nc < maxA) { ep[idx] = epc; nxtL[nc++] = idx; } }
                    if(x<W-1) { let idx=i-W+1; if (ep[idx] !== epc && nc < maxA) { ep[idx] = epc; nxtL[nc++] = idx; } }
                } 
                if(x>0) { let idx=i-1; if (ep[idx] !== epc && nc < maxA) { ep[idx] = epc; nxtL[nc++] = idx; } }
                if(x<W-1) { let idx=i+1; if (ep[idx] !== epc && nc < maxA) { ep[idx] = epc; nxtL[nc++] = idx; } }
                if(y<H-1){ 
                    if(x>0) { let idx=i+W-1; if (ep[idx] !== epc && nc < maxA) { ep[idx] = epc; nxtL[nc++] = idx; } }
                    { let idx=i+W; if (ep[idx] !== epc && nc < maxA) { ep[idx] = epc; nxtL[nc++] = idx; } }
                    if(x<W-1) { let idx=i+W+1; if (ep[idx] !== epc && nc < maxA) { ep[idx] = epc; nxtL[nc++] = idx; } }
                } 
                this.nxtC = nc;
            }
            
            paint(x, y, items) { this.paintQ.push({x, y, items}); }
            applyPaints() { 
                for (let p of this.paintQ) { 
                    for (let item of p.items) {
                        let mat = item.mat, s = item.size;
                        if (s > 0) {
                            // Fast integer square root approximation for radius
                            let r = 0, s2 = 0;
                            while (s2 < s) { r++; s2 += 2 * r - 1; }
                            let r2 = r * r;
                            
                            for(let i = 0; i < s; i++) {
                                let dx = 0, dy = 0;
                                // Rejection sampling for perfect circle
                                do {
                                    dx = ((Math.random() * (2 * r + 1)) | 0) - r;
                                    dy = ((Math.random() * (2 * r + 1)) | 0) - r;
                                } while(dx * dx + dy * dy > r2);
                                
                                let nx = p.x + dx;
                                let ny = p.y + dy;
                                if(nx >= 0 && nx < this.W && ny >= 0 && ny < this.H) {
                                    let idx = ny * this.W + nx;
                                    if(this.grid[idx] === MAT.EMPTY) {
                                        this.grid[idx] = mat;
                                        this.vx[idx] = 0; 
                                        this.vy[idx] = 0;
                                        this.addA(idx); this.wake(idx); 
                                    }
                                }
                            }
                        }
                    }
                } 
                this.paintQ.length = 0; 
            }
            update() {
                let tL=this.actL; this.actL=this.nxtL; this.nxtL=tL;
                this.actC = this.nxtC; this.nxtC = 0; this.epc++; this.applyPaints();
                let u = this.upd, actL = this.actL, actC = this.actC, W = this.W, g = this.grid, dMin = this.dMin, dMax = this.dMax;
                // Processed cells' origin rows are dirty (they may have vacated)
                for(let i=0; i<actC; i++) { let idx=actL[i]; u[idx] = 0; let y=(idx/W)|0; if(y<dMin)dMin=y; if(y>dMax)dMax=y; }
                this.dMin = dMin; this.dMax = dMax;
                // Mutated target cells get tracked inside addA()
                for(let i=0; i<actC; i++) { let idx=actL[i]; if(!u[idx] && g[idx]!==MAT.EMPTY) this.proc(idx, 0); }
            }

            proc(idx, depth) {
                const W=this.W, H=this.H, g=this.grid, vx=this.vx, vy=this.vy, u=this.upd;
                let x=idx%W, y=(idx/W)|0, t=g[idx];
                if(t===MAT.EMPTY) return;
                u[idx]=1;

                let pressure = 0;
                if (t === MAT.WATER) {
                    for (let py = y - 1; py >= 0; py--) {
                        if (g[py * W + x] === MAT.WATER) pressure++;
                        else break;
                    }
                    let soakChance = 0.05 + pressure * 0.05;
                    if (Math.random() < soakChance) {
                        if (y+1<H && g[idx+W] === MAT.SAND) {
                            let nIdx = idx+W;
                            g[idx]=MAT.EMPTY; g[nIdx]=MAT.WET_SAND; vx[idx]=0; vy[idx]=0;
                            u[idx]=1; u[nIdx]=1; this.addA(idx); this.addA(nIdx); this.wake(idx); this.wake(nIdx); return;
                        }
                        if (x>0 && g[idx-1] === MAT.SAND) {
                            let nIdx = idx-1;
                            g[idx]=MAT.EMPTY; g[nIdx]=MAT.WET_SAND; vx[idx]=0; vy[idx]=0;
                            u[idx]=1; u[nIdx]=1; this.addA(idx); this.addA(nIdx); this.wake(idx); this.wake(nIdx); return;
                        }
                        if (x<W-1 && g[idx+1] === MAT.SAND) {
                            let nIdx = idx+1;
                            g[idx]=MAT.EMPTY; g[nIdx]=MAT.WET_SAND; vx[idx]=0; vy[idx]=0;
                            u[idx]=1; u[nIdx]=1; this.addA(idx); this.addA(nIdx); this.wake(idx); this.wake(nIdx); return;
                        }
                        if (y>0 && g[idx-W] === MAT.SAND) {
                            let nIdx = idx-W;
                            g[idx]=MAT.EMPTY; g[nIdx]=MAT.WET_SAND; vx[idx]=0; vy[idx]=0;
                            u[idx]=1; u[nIdx]=1; this.addA(idx); this.addA(nIdx); this.wake(idx); this.wake(nIdx); return;
                        }
                    }
                }

                let vxc = vx[idx];
                let vyc = vy[idx];
                vyc += 1.2; 
                
                if ((y + 1 >= H || g[idx + W] !== MAT.EMPTY)) {
                    vxc *= (t===MAT.WATER) ? 0.975 : MAT.FRICTION[t];
                    if (vxc < 0) { if (-vxc < 0.1) vxc = 0; } else { if (vxc < 0.1) vxc = 0; }
                }
                
                let avx = vxc < 0 ? -vxc : vxc;
                let avy = vyc < 0 ? -vyc : vyc;
                let maxV = avx > avy ? avx : avy;
                let stepsToProcess = maxV | 0;
                if (stepsToProcess > 30) stepsToProcess = 30;

                let stepsTakenX = 0, stepsTakenY = 0;
                let cx=x, cy=y, cIdx=idx, moved=false;
                let finalVx = vxc, finalVy = vyc;
                
                for(let i=0; i<stepsToProcess; i++) {
                    let sx=0, sy=0;
                    if(avx > stepsTakenX) { sx=vxc < 0 ? -1 : 1; stepsTakenX++; }
                    if(avy > stepsTakenY) { sy=vyc < 0 ? -1 : 1; stepsTakenY++; }
                    if(sx===0 && sy===0) break;
                    
                    let nx=cx+sx, ny=cy+sy;
                    if(nx<0||nx>=W) { finalVx=0; sx=0; nx=cx; }
                    if(ny<0||ny>=H) { finalVy=0; sy=0; ny=cy; }
                    if(sx===0 && sy===0) break;
                    
                    let nIdx=ny*W+nx, nt=g[nIdx];
                    
                    if(nt===MAT.EMPTY) {
                        g[nIdx]=t; g[cIdx]=MAT.EMPTY; u[nIdx]=1; u[cIdx]=1; 
                        cx=nx; cy=ny; cIdx=nIdx; moved=true;
                    } else if (MAT.DENSITY[t] > MAT.DENSITY[nt]) {
                        if((t===MAT.SAND || t===MAT.WET_SAND) && nt===MAT.WATER) {
                            if (t===MAT.SAND) { g[cIdx]=MAT.EMPTY; g[nIdx]=MAT.WET_SAND; }
                            else { g[cIdx]=MAT.WATER; g[nIdx]=MAT.WET_SAND; vy[cIdx]=-1.5; }
                            vx[cIdx]=0; vy[cIdx]=0;
                            u[nIdx]=1; u[cIdx]=1; this.addA(nIdx); this.addA(cIdx); this.wake(nIdx); this.wake(cIdx);
                            return;
                        }
                        g[cIdx]=nt; g[nIdx]=t;
                        let tvx=vx[nIdx], tvy=vy[nIdx];
                        vx[nIdx]=finalVx*0.5; vy[nIdx]=finalVy*0.5; vx[cIdx]=tvx*0.8; vy[cIdx]=tvy*0.8-1.5;
                        u[nIdx]=1; u[cIdx]=1; this.addA(nIdx); this.addA(cIdx); this.wake(nIdx); this.wake(cIdx);
                        return;
                    } else if (nt === t) {
                        if ((ny + 1 < H) && (g[nIdx + W] === MAT.EMPTY)) {
                            // Hit an unsupported particle of the same type. 
                            // Transfer momentum and stop to prevent sideways explosions.
                            if (depth < 4) {
                                vx[nIdx] += finalVx * 0.5; vy[nIdx] += finalVy * 0.5; 
                                u[nIdx] = 1; this.addA(nIdx); this.proc(nIdx, depth + 1); 
                                if (g[nIdx] !== MAT.EMPTY) {
                                    finalVx = 0; finalVy = 0; break;
                                } else { finalVx *= 0.5; finalVy *= 0.5; }
                            } else {
                                finalVx = 0; finalVy = 0; break;
                            }
                        } else {
                            // Hit a supported particle of the same type.
                            if (sy > 0) {
                                finalVy = 0;
                                if (t === MAT.WATER) {
                                    let force = 2.5 + pressure * 0.8;
                                    if (force > 8.0) force = 8.0;
                                    if(cx>0&&g[cIdx-1]===MAT.EMPTY) finalVx -= vyc * force; 
                                    if(cx<W-1&&g[cIdx+1]===MAT.EMPTY) finalVx += vyc * force; 
                                    
                                    if (finalVx === 0 && finalVy === 0 && pressure > 0) {
                                        let lE = cx > 0 && g[cIdx - 1] === MAT.EMPTY;
                                        let rE = cx < W - 1 && g[cIdx + 1] === MAT.EMPTY;
                                        if (lE && rE) finalVx = (Math.random() < 0.5 ? -1 : 1) * pressure * 0.5; 
                                        else if (lE) finalVx = -pressure * 0.5;
                                        else if (rE) finalVx = pressure * 0.5;
                                    }
                                    if (vyc > 6.0 && pressure > 3 && Math.random() < 0.2) finalVy = -vyc * 0.3; 
                                } else {
                                    // Sand hitting sand: transfer some momentum, stop completely. No bounce, no forced slide.
                                    vy[nIdx] += vyc * 0.1; 
                                    vx[nIdx] += vxc * 0.1;
                                    u[nIdx] = 1; this.addA(nIdx);
                                    finalVy = 0;
                                    finalVx = 0;
                                }
                                break;
                            } else { finalVx *= -0.1; finalVy *= -0.1; break; }
                        }
                    } else if (t === MAT.WATER && nt === MAT.SAND) {
                        if (Math.random() < 0.1) {
                            g[cIdx] = MAT.EMPTY; g[nIdx] = MAT.WET_SAND; vx[cIdx]=0; vy[cIdx]=0; 
                            u[cIdx]=1; u[nIdx]=1; this.addA(cIdx); this.addA(nIdx); this.wake(cIdx); this.wake(nIdx); return; 
                        }
                    } else {
                        if (sy > 0) { 
                            finalVy = 0; 
                            if (t === MAT.WATER) { 
                                let force = 2.5 + pressure * 0.8;
                                if (force > 8.0) force = 8.0;
                                if(cx>0&&g[cIdx-1]===MAT.EMPTY) finalVx -= vyc * force; 
                                if(cx<W-1&&g[cIdx+1]===MAT.EMPTY) finalVx += vyc * force; 
                                
                                if (finalVx === 0 && finalVy === 0 && pressure > 0) {
                                    let lE = cx > 0 && g[cIdx - 1] === MAT.EMPTY;
                                    let rE = cx < W - 1 && g[cIdx + 1] === MAT.EMPTY;
                                    if (lE && rE) finalVx = (Math.random() < 0.5 ? -1 : 1) * pressure * 0.5;
                                    else if (lE) finalVx = -pressure * 0.5;
                                    else if (rE) finalVx = pressure * 0.5;
                                }
                                if (vyc > 6.0 && pressure > 3 && Math.random() < 0.2) finalVy = -vyc * 0.3; 
                            } else {
                                let sDir = finalVx > 0.1 ? 1 : (finalVx < -0.1 ? -1 : (Math.random() < 0.5 ? 1 : -1));
                                if (tryDiag(this, t, cx, cy, cIdx, sDir, 3.0)) { cx += sDir; cy++; cIdx += W + sDir; moved = true; }
                            }
                            break; 
                        } else { finalVx *= -0.1; finalVy *= -0.1; break; }
                    }
                }
                
                if (moved) { this.wake(cIdx); this.wake(idx); }
                vx[cIdx] = finalVx; vy[cIdx] = finalVy;
                
                if (!moved || (Math.abs(finalVx) < 1.0 && Math.abs(finalVy) < 1.0)) {
                    let rMoved = false;
                    if (t !== MAT.WATER) {
                        if (cy + 1 < H && g[cIdx + W] === MAT.EMPTY) {
                            let bIdx = cIdx + W;
                            g[bIdx] = t; g[cIdx] = MAT.EMPTY; vy[bIdx] = vy[cIdx] + 1.2; vx[bIdx] = vx[cIdx]; vx[cIdx] = 0; vy[cIdx] = 0;
                            u[bIdx] = 1; u[cIdx] = 1; this.addA(bIdx); this.wake(cIdx); cIdx = bIdx; cy++; rMoved = true; 
                        }
                        if (!rMoved) {
                            let d = Math.random() < 0.5 ? 1 : -1; 
                            if (tryDensitySlide(this, t, cx, cy, cIdx, d)) { cx += d; cy++; cIdx += W + d; rMoved = true; }
                            else if (tryDensitySlide(this, t, cx, cy, cIdx, -d)) { cx -= d; cy++; cIdx += W - d; rMoved = true; }

                            if (!rMoved && cy + 1 < H && g[cIdx + W] === t && Math.abs(vx[cIdx]) < 0.5) {
                                let rollD = Math.random() < 0.5 ? 1 : -1;
                                if (tryRoll(this, t, cx, cy, cIdx, rollD)) { cx += rollD; cIdx += rollD; rMoved = true; }
                                else if (tryRoll(this, t, cx, cy, cIdx, -rollD)) { cx -= rollD; cIdx -= rollD; rMoved = true; }
                            }

                            if (!rMoved && cy + 1 < H && g[cIdx + W] === t) {
                                if (Math.abs(vx[cIdx]) < 0.1 && Math.random() < 0.02) {
                                    let rollDir = (Math.random() < 0.5) ? 1 : -1;
                                    if (cx + rollDir >= 0 && cx + rollDir < W) {
                                        let sIdx = cIdx + rollDir;
                                        let dIdx = cIdx + W + rollDir;
                                        if (g[sIdx] === MAT.EMPTY && g[dIdx] === MAT.EMPTY) {
                                            g[dIdx] = t; g[cIdx] = MAT.EMPTY;
                                            vx[dIdx] = rollDir * 2.5; vy[dIdx] = 1.0; 
                                            u[dIdx] = 1; u[cIdx] = 1; this.addA(dIdx); this.wake(cIdx);
                                            cIdx = dIdx; cx += rollDir; cy++; rMoved = true;
                                        }
                                    }
                                }
                            }

                            if (!rMoved && cy + 1 < H && g[cIdx + W] === t && Math.abs(vx[cIdx]) < 0.5) {
                                let dir = (Math.random() < 0.5) ? 1 : -1;
                                if (cx + dir >= 0 && cx + dir < W) {
                                    let s1 = cIdx + dir;
                                    let d1 = s1 + W;
                                    if (g[s1] === t && g[d1] === MAT.EMPTY) {
                                        if (Math.random() < 0.05) { 
                                            g[s1] = t; g[d1] = t; g[cIdx] = MAT.EMPTY;
                                            vx[s1] = 0; vy[s1] = 0;
                                            vx[d1] = dir * 2.5; vy[d1] = 1.5; 
                                            vx[cIdx] = 0; vy[cIdx] = 0;
                                            u[s1] = 1; u[d1] = 1; u[cIdx] = 1;
                                            this.addA(s1); this.addA(d1); this.addA(cIdx); this.wake(cIdx);
                                            cIdx = s1; cx += dir; rMoved = true;
                                        }
                                    }
                                }
                            }
                        }
                    } else {
                        if (cy + 1 < H && g[cIdx + W] === MAT.EMPTY) { 
                            let bIdx = cIdx + W;
                            g[bIdx] = t; g[cIdx] = MAT.EMPTY; vy[bIdx] = vy[cIdx] + 1.2; vx[bIdx] = vx[cIdx]; vx[cIdx] = 0; vy[cIdx] = 0;
                            u[bIdx] = 1; u[cIdx] = 1; this.addA(bIdx); this.wake(cIdx); cIdx = bIdx; cy++; rMoved = true; 
                        }
                        if (!rMoved) {
                            let d = Math.random() < 0.5 ? 1 : -1; 
                            if (tryDiag(this, t, cx, cy, cIdx, d, 4.0)) { cx += d; cy++; cIdx += W + d; rMoved = true; }
                            else if (tryDiag(this, t, cx, cy, cIdx, -d, 4.0)) { cx -= d; cy++; cIdx += W - d; rMoved = true; }
                            else {
                                let touchingSand = (cy + 1 < H && g[cIdx + W] === MAT.SAND) || (cy > 0 && g[cIdx - W] === MAT.SAND) || (cx > 0 && g[cIdx - 1] === MAT.SAND) || (cx < W - 1 && g[cIdx + 1] === MAT.SAND);
                                let touchingWetSand = (cy + 1 < H && g[cIdx + W] === MAT.WET_SAND) || (cy > 0 && g[cIdx - W] === MAT.WET_SAND) || (cx > 0 && g[cIdx - 1] === MAT.WET_SAND) || (cx < W - 1 && g[cIdx + 1] === MAT.WET_SAND);
                                
                                if (Math.random() < 0.1 && touchingSand) {
                                    if (cy+1<H && g[cIdx+W] === MAT.SAND) {
                                        let nIdx = cIdx+W; g[cIdx] = MAT.EMPTY; g[nIdx] = MAT.WET_SAND; vx[cIdx]=0; vy[cIdx]=0; u[cIdx]=1; u[nIdx]=1; this.addA(cIdx); this.addA(nIdx); this.wake(cIdx); this.wake(nIdx); return; 
                                    }
                                    if (cx+1<W && g[cIdx+1] === MAT.SAND) {
                                        let nIdx = cIdx+1; g[cIdx] = MAT.EMPTY; g[nIdx] = MAT.WET_SAND; vx[cIdx]=0; vy[cIdx]=0; u[cIdx]=1; u[nIdx]=1; this.addA(cIdx); this.addA(nIdx); this.wake(cIdx); this.wake(nIdx); return; 
                                    }
                                    if (cx>0 && g[cIdx-1] === MAT.SAND) {
                                        let nIdx = cIdx-1; g[cIdx] = MAT.EMPTY; g[nIdx] = MAT.WET_SAND; vx[cIdx]=0; vy[cIdx]=0; u[cIdx]=1; u[nIdx]=1; this.addA(cIdx); this.addA(nIdx); this.wake(cIdx); this.wake(nIdx); return; 
                                    }
                                    if (cy>0 && g[cIdx-W] === MAT.SAND) {
                                        let nIdx = cIdx-W; g[cIdx] = MAT.EMPTY; g[nIdx] = MAT.WET_SAND; vx[cIdx]=0; vy[cIdx]=0; u[cIdx]=1; u[nIdx]=1; this.addA(cIdx); this.addA(nIdx); this.wake(cIdx); this.wake(nIdx); return; 
                                    }
                                }

                                // RANDOM WALK PATHFINDING SOAK: 3x max distance (180), Cubic curve falloff
                                if (touchingWetSand && Math.random() < SOAK_PROB) {
                                    let maxSteps = 180; 
                                    let wx = cx, wy = cy;
                                    for (let s = 1; s <= maxSteps; s++) {
                                        let r = Math.random();
                                        let dx = 0, dy = 0;
                                        if (r < 0.7) dy = 1;       // 70% chance down (heavy gravity bias for depth)
                                        else if (r < 0.85) dx = 1; // 15% right
                                        else dx = -1;              // 15% left
                                        
                                        let nx = wx + dx, ny = wy + dy;
                                        if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
                                        
                                        let nIdx = ny * W + nx;
                                        if (g[nIdx] === MAT.WET_SAND) {
                                            wx = nx; wy = ny; // Continue pathfinding
                                        } else if (g[nIdx] === MAT.SAND) {
                                            // Found dry sand! Calculate cubic soak chance (100% at s=1, ~12.5% at halfway, 0% at 180)
                                            let progress = (s - 1) / (maxSteps - 1);
                                            let soakChance = Math.pow(1.0 - progress, 3);
                                            
                                            if (Math.random() < soakChance) {
                                                // Soak it!
                                                g[cIdx] = MAT.EMPTY; g[nIdx] = MAT.WET_SAND; vx[cIdx]=0; vy[cIdx]=0; 
                                                u[cIdx]=1; u[nIdx]=1; this.addA(cIdx); this.addA(nIdx); this.wake(cIdx); this.wake(nIdx); return;
                                            } else {
                                                // Failed the distance roll, stop the walk.
                                                break;
                                            }
                                        } else {
                                            break; // Hit air, water, or wall. Stop walk.
                                        }
                                    }
                                }

                                let lE = -1, rE = -1, lD = false, rD = false;
                                for (let i=1; i<=30; i++) {
                                    if (cx - i < 0) break;
                                    let cIdxL = cy * W + (cx - i);
                                    if (g[cIdxL] === MAT.SAND || g[cIdxL] === MAT.WET_SAND) break;
                                    if (g[cIdxL] === MAT.EMPTY) { lE = i; if (cy+1<H && g[cIdxL+W]===MAT.EMPTY) lD = true; break; }
                                }
                                for (let i=1; i<=30; i++) {
                                    if (cx + i >= W) break;
                                    let cIdxR = cy * W + (cx + i);
                                    if (g[cIdxR] === MAT.SAND || g[cIdxR] === MAT.WET_SAND) break;
                                    if (g[cIdxR] === MAT.EMPTY) { rE = i; if (cy+1<H && g[cIdxR+W]===MAT.EMPTY) rD = true; break; }
                                }

                                if (lE !== -1 || rE !== -1) {
                                    let dir = (lE !== -1 && rE !== -1) ? ((lD && !rD) ? -1 : (rD && !lD) ? 1 : (lE <= rE ? -1 : 1)) : (lE !== -1 ? -1 : 1);
                                    let dist = dir === -1 ? lE : rE;
                                    let targetX = cx + (dir * dist), targetIdx = cy * W + targetX;
                                    g[targetIdx] = MAT.WATER; g[cIdx] = MAT.EMPTY;
                                    let isDown = (dir == -1 && lD) || (dir == 1 && rD);
                                    let speed = isDown ? 12.0 : 6.0;
                                    vx[targetIdx] = dir * speed; vy[targetIdx] = isDown ? 3.0 : 0;
                                    vx[cIdx] = 0; vy[cIdx] = 0;
                                    u[targetIdx] = 1; u[cIdx] = 1; this.addA(targetIdx); this.addA(cIdx); this.wake(cIdx);
                                    
                                    for (let py = cy - 1; py >= 0; py--) {
                                        let upI = py * W + cx;
                                        if (g[upI] === MAT.WATER) {
                                            vx[upI] = dir * speed * 0.8; 
                                            vy[upI] = 3.0; 
                                            u[upI] = 1; this.addA(upI);
                                        } else break;
                                    }
                                    
                                    cIdx = targetIdx; cx = targetX; rMoved = true;
                                } else if (touchingSand || touchingWetSand) {
                                    this.addA(cIdx); 
                                    return;
                                }
                            }
                        }
                    }
                    if (!rMoved) { 
                        vx[cIdx] *= 0.5; vy[cIdx] *= 0.5; 
                        if (Math.abs(vx[cIdx]) < 0.1) vx[cIdx] = 0; 
                        if (Math.abs(vy[cIdx]) < 0.1) vy[cIdx] = 0; 
                        if (vx[cIdx] === 0 && vy[cIdx] === 0) return; 
                    }
                }
                this.addA(cIdx);
            }
        }
        let engine, lastT=0, acc=0, tpsC=0, lastTps=0, cTps=0, lastStats=0; let TPS=60, TMS=1000/TPS, SOAK_PROB=0.35, STATS_MS=500;
        let counts = new Int32Array(4);
        function tick() {
            let now = performance.now(); if(lastT===0){lastT=now;lastTps=now;} let d=now-lastT; lastT=now; acc+=d;
            let t=0; while(acc>=TMS && t<2){ engine.update(); acc-=TMS; t++; tpsC++; } if(acc>TMS*2) acc=0;
            if(now-lastTps>=1000){ cTps=tpsC; tpsC=0; lastTps=now; }
            if(STATS_MS && now-lastStats>=STATS_MS){
                lastStats=now;
                counts.fill(0);
                let g=engine.grid, len=g.length;
                for(let i=0;i<len;i++) counts[g[i]]++;
                self.postMessage({type:'stats', aC:engine.actC, tps:cTps, counts:counts});
            }
            // Send only the changed row span, in a fresh buffer. No round-trip needed.
            if(engine.dMax >= engine.dMin && engine.dMax >= 0){
                let W=engine.W, H=engine.H;
                let y0 = engine.dMin < 0 ? 0 : engine.dMin;
                let y1 = engine.dMax >= H ? H - 1 : engine.dMax;
                let start = y0 * W, n = (y1 - y0 + 1) * W;
                let out = new Uint8Array(n);
                out.set(engine.grid.subarray(start, start + n));
                self.postMessage({type:'render', buf: out.buffer, y0: y0, rows: y1 - y0 + 1}, [out.buffer]);
                engine.dMin = H; engine.dMax = -1;
            }
            setTimeout(tick, 0);
        }
        self.onmessage = e => {
            const d = e.data;
            if(d.type==='init'){
                engine=new PhysicsEngine(d.w,d.h); lastT=0; lastTps=0; lastStats=0; tpsC=0;
                if(d.soft){ TPS=30; TMS=1000/TPS; SOAK_PROB=0.12; }
                tick();
            }
            else if(d.type==='paint'){ engine.paint(d.x, d.y, d.items); }
            else if(d.type==='clear'){ engine.clear(); }
        };
        `;

        const canvas = document.getElementById('simCanvas');
        const statsDiv = document.getElementById('stats');
        const stuffChk = document.getElementById('stuffChk');
        const sandChkEl = document.getElementById('sandChk');
        const waterChkEl = document.getElementById('waterChk');
        let gl, prog, tex, vao, traceLoc, pbo, worker = null, sS = 100, wS = 100, mDown = false, lastX = 0, lastY = 0, aC = 0, cTps = 0, counts = [0,0,0,0], fpsL = performance.now(), fpsF = 0, pendQ = [], upRows = 0, cRect = null, ftEMA = 0, lastFT = 0, needDraw = true, lastTrace = -1, lastDraw = 0;

        // Detect software rasterizer (Chrome "Use GPU" off -> SwiftShader, or Mesa llvmpipe/softpipe).
        // Software WebGL is ~100x slower — compensate with lower resolution & shader cost.
        function probeSoftwareGL() {
            try {
                let c = document.createElement('canvas'); c.width = c.height = 1;
                let g = c.getContext('webgl2') || c.getContext('webgl');
                if (!g) return false;
                let di = g.getExtension('WEBGL_debug_renderer_info');
                if (!di) return false;
                let r = g.getParameter(di.UNMASKED_RENDERER_WEBGL) || '';
                return /swiftshader|software|llvmpipe|softpipe/gi.test(r);
            } catch (e) { return false; }
        }
        const SOFT = probeSoftwareGL() || new URLSearchParams(location.search).has('soft');
        // Internal (backing-store) size as a fraction of CSS pixels.
        // Halving each axis = 1/4 GPU fragments and 1/4 grid cells (physics too).
        const RES_SCALE = SOFT ? 0.25 : 1.0;
        // Water gap-fill trace: up to 8 texture reads per empty pixel — the #1 shader cost.
        // Cosmetic only; cut to 0 under software GL.
        const TRACE_DIST = SOFT ? 0 : 4;
        // Cap draw rate; idle sim already skips draws via needDraw.
        const MAX_FPS = SOFT ? 30 : 60;

        function setupEvents() {
            canvas.addEventListener('pointerdown', e => { 
                if (e.target.id !== 'simCanvas') return; 
                mDown = true; canvas.setPointerCapture(e.pointerId); lastX = e.clientX; lastY = e.clientY; 
            });
            canvas.addEventListener('pointermove', e => { if (mDown) { lastX = e.clientX; lastY = e.clientY; } });
            ['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => mDown = false));
            window.addEventListener('blur', () => mDown = false);
            // Coming back to the tab: the front buffer may be gone, redraw once.
            document.addEventListener('visibilitychange', () => { if (!document.hidden) needDraw = true; });
            
            document.getElementById('clearBtn').onclick = () => worker && worker.postMessage({ type: 'clear' });
            document.getElementById('sandSizeSlider').oninput = e => sS = +e.target.value;
            document.getElementById('waterSizeSlider').oninput = e => wS = +e.target.value;
        }

        function initGL() {
            // alpha:false -> opaque canvas, skips per-frame compositing blend.
            // powerPreference:'high-performance' -> forces the discrete GPU on hybrid laptops.
            // desynchronized:true -> low-latency present path where supported.
            gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance', desynchronized: true }); if (!gl) return false;
            const vs = gl.createShader(gl.VERTEX_SHADER); 
            gl.shaderSource(vs, `#version 300 es\nin vec2 a_pos; out vec2 v_uv; void main(){ v_uv = a_pos*0.5+0.5; v_uv.y = 1.0-v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0); }`); 
            gl.compileShader(vs);
            
            const fs = gl.createShader(gl.FRAGMENT_SHADER); 
            gl.shaderSource(fs, `#version 300 es
                precision highp float;
                in vec2 v_uv;
                uniform highp usampler2D u_grid;
                uniform vec2 u_texelSize;
                uniform int u_trace;
                out vec4 c;

                vec4 getCol(uint id) {
                    if(id==1u) return vec4(0.76, 0.69, 0.5, 1.0);    // Sand
                    if(id==2u) return vec4(0.35, 0.7, 1.0, 1.0);     // Water
                    if(id==3u) return vec4(0.55, 0.42, 0.25, 1.0);   // Wet Sand
                    return vec4(1.0, 1.0, 1.0, 1.0);                 // Empty
                }

                void main() {
                    uint id = texture(u_grid, v_uv).r;
                    if (id != 0u) { c = getCol(id); return; }
                    if (u_trace == 1) {
                        // Optimized 4-direction trace for gap filling
                        // Horizontal trace (left then right)
                        bool foundL = false;
                        for(int i=1; i<=${TRACE_DIST}; i++) {
                            uint t = texture(u_grid, v_uv - vec2(u_texelSize.x * float(i), 0.0)).r;
                            if (t != 0u) { if (t == 2u) foundL = true; break; }
                        }
                        if (foundL) {
                            for(int i=1; i<=${TRACE_DIST}; i++) {
                                uint t = texture(u_grid, v_uv + vec2(u_texelSize.x * float(i), 0.0)).r;
                                if (t != 0u) { if (t == 2u) { c = getCol(2u); return; } break; }
                            }
                        }
                        
                        // Vertical trace (down then up)
                        bool foundD = false;
                        for(int i=1; i<=${TRACE_DIST}; i++) {
                            uint t = texture(u_grid, v_uv + vec2(0.0, u_texelSize.y * float(i))).r;
                            if (t != 0u) { if (t == 2u) foundD = true; break; }
                        }
                        if (foundD) {
                            for(int i=1; i<=${TRACE_DIST}; i++) {
                                uint t = texture(u_grid, v_uv - vec2(0.0, u_texelSize.y * float(i))).r;
                                if (t != 0u) { if (t == 2u) { c = getCol(2u); return; } break; }
                            }
                        }
                        
                        // Diagonal trace (down-left then up-right)
                        bool foundDL = false;
                        for(int i=1; i<=${TRACE_DIST}; i++) {
                            uint t = texture(u_grid, v_uv + vec2(-u_texelSize.x * float(i), u_texelSize.y * float(i))).r;
                            if (t != 0u) { if (t == 2u) foundDL = true; break; }
                        }
                        if (foundDL) {
                            for(int i=1; i<=${TRACE_DIST}; i++) {
                                uint t = texture(u_grid, v_uv + vec2(u_texelSize.x * float(i), -u_texelSize.y * float(i))).r;
                                if (t != 0u) { if (t == 2u) { c = getCol(2u); return; } break; }
                            }
                        }
                        
                        // Diagonal trace (down-right then up-left)
                        bool foundDR = false;
                        for(int i=1; i<=${TRACE_DIST}; i++) {
                            uint t = texture(u_grid, v_uv + vec2(u_texelSize.x * float(i), u_texelSize.y * float(i))).r;
                            if (t != 0u) { if (t == 2u) foundDR = true; break; }
                        }
                        if (foundDR) {
                            for(int i=1; i<=${TRACE_DIST}; i++) {
                                uint t = texture(u_grid, v_uv + vec2(-u_texelSize.x * float(i), -u_texelSize.y * float(i))).r;
                                if (t != 0u) { if (t == 2u) { c = getCol(2u); return; } break; }
                            }
                        }
                    }
                    c = vec4(1.0, 1.0, 1.0, 1.0);
                }`); 
            gl.compileShader(fs);
            
            prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog); gl.useProgram(prog);
            traceLoc = gl.getUniformLocation(prog, "u_trace");
            vao = gl.createVertexArray(); gl.bindVertexArray(vao);
            const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
            const pLoc = gl.getAttribLocation(prog, "a_pos"); gl.enableVertexAttribArray(pLoc); gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);
            tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1); gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8UI, canvas.width, canvas.height, 0, gl.RED_INTEGER, gl.UNSIGNED_BYTE, new Uint8Array(canvas.width * canvas.height));
            gl.uniform1i(gl.getUniformLocation(prog, "u_grid"), 0); 
            gl.uniform2f(gl.getUniformLocation(prog, "u_texelSize"), 1.0 / canvas.width, 1.0 / canvas.height);
            // Persistent PBO for async texture uploads (avoids CPU-memory upload sync stalls)
            pbo = gl.createBuffer();
            gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, pbo);
            gl.bufferData(gl.PIXEL_UNPACK_BUFFER, canvas.width * canvas.height, gl.STREAM_DRAW);
            gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, null);
            return true;
        }

        function initWorker() {
            worker = new Worker(URL.createObjectURL(new Blob([workerCode], { type: 'application/javascript' })));
            worker.onmessage = e => {
                if (e.data.type === 'render') {
                    if (pendQ.length < 16) pendQ.push({ buf: e.data.buf, y0: e.data.y0, rows: e.data.rows });
                } else if (e.data.type === 'stats') {
                    aC = e.data.aC; 
                    cTps = e.data.tps; 
                    counts = e.data.counts; 
                } 
            };
            worker.postMessage({ type: 'init', w: canvas.width, h: canvas.height, soft: SOFT });
        }

        function rLoop(now = performance.now()) {
            if (mDown) paint(lastX, lastY);
            while (pendQ.length) {
                let p = pendQ.shift();
                try {
                    // Upload just the changed row span via PBO
                    gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, pbo);
                    gl.bufferSubData(gl.PIXEL_UNPACK_BUFFER, 0, new Uint8Array(p.buf));
                    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, p.y0, canvas.width, p.rows, gl.RED_INTEGER, gl.UNSIGNED_BYTE, 0);
                    gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, null);
                    upRows = p.rows;
                    needDraw = true;
                } catch (e) {}
            }
            // Only draw when something actually changed: new texture data, trace state
            // flipped, first frame, or tab was re-shown. Idle frames cost ~nothing.
            let tr = counts[2] > 0 ? 1 : 0;
            if (tr !== lastTrace) { lastTrace = tr; needDraw = true; }
            if (needDraw && now - lastDraw >= 1000 / MAX_FPS) {
                gl.uniform1i(traceLoc, tr);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                needDraw = false;
                lastDraw = now;
            }
            fpsF++;
            if (lastFT) { let dt = now - lastFT; ftEMA = ftEMA ? ftEMA * 0.9 + dt * 0.1 : dt; }
            lastFT = now;
            requestAnimationFrame(rLoop);
        }

        function paint(cx, cy) {
            if (!worker || !cRect) return;
            const x = Math.floor((cx - cRect.left) * (canvas.width / cRect.width)), y = Math.floor((cy - cRect.top) * (canvas.height / cRect.height));
            let items = [];
            if (sandChkEl.checked) items.push({mat: 1, size: sS});
            if (waterChkEl.checked) items.push({mat: 2, size: wS});
            if (items.length > 0) worker.postMessage({ type: 'paint', x, y, items: items });
        }

        setInterval(() => {
            if (!stuffChk.checked) return;
            let n = performance.now(), dt = n - fpsL, f = dt > 0 ? (fpsF * 1000) / dt : 0;
            fpsL = n; fpsF = 0;
            let sandC = counts[1] || 0;
            let waterC = counts[2] || 0;
            let wetC = counts[3] || 0;
            let totalC = sandC + waterC + wetC;
            let totalCells = canvas.width * canvas.height;
            let emptyC = totalCells - totalC;
            statsDiv.innerText = `FPS: ${f.toFixed(0)}\nFrame: ${ftEMA.toFixed(1)}ms\nTPS: ${cTps}\nActive: ${aC}\nUp: ${upRows} rows\nRenderer: GPU\nSand: ${sandC}\nWater: ${waterC}\nWet Sand: ${wetC}\nTotal: ${totalC}\nEmpty: ${emptyC}\nGrid: ${canvas.width}x${canvas.height}`;
        }, 500);

        function init() {
            canvas.width = Math.max(64, Math.floor(window.innerWidth * RES_SCALE));
            canvas.height = Math.max(64, Math.floor(window.innerHeight * RES_SCALE));
            setupEvents();
            cRect = canvas.getBoundingClientRect();
            try { if (initGL()) { initWorker(); rLoop(); } } catch (e) {}
            window.addEventListener('resize', () => location.reload());
        }
        init();
    </script>
